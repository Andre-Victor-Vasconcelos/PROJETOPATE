<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match da Permuta - ATE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #004d99; --primary-light: #337ab7; --bg-color: #f4f7f9; --text-color: #333; --card-bg: #fff; --success: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); }
        nav { background-color: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .view { display: none; }
        .view.active { display: block; }
        .btn-primary { background-color: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; cursor: pointer; }
        .auth-box { background: white; padding: 2rem; margin: 2rem auto; max-width: 400px; }
        body:not(.logged-in) .logged-in-only { display: none !important; }
        body.logged-in .logged-out-only { display: none !important; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Match da Permuta <span>ATE</span></div>
        <ul id="nav-links" style="display: flex; list-style: none; gap: 1rem;">
            <li><a href="#" onclick="showView('home')">Início</a></li>
            <li><a href="#" onclick="showView('search')">Buscar</a></li>
            <li class="logged-in-only"><a href="#" onclick="showView('matches')">Matches</a></li>
            <li class="logged-in-only"><a href="#" onclick="logout()">Sair</a></li>
            <li class="logged-out-only"><a href="#" onclick="showView('auth')">Entrar</a></li>
        </ul>
    </nav>

    <main id="app-container">
        <section id="home-view" class="view active">
            <div style="text-align: center; padding: 2rem;">
                <h1>Match da Permuta ATE</h1>
                <button class="btn-primary" onclick="showView('auth')">Entrar / Cadastrar</button>
            </div>
        </section>

        <section id="auth-view" class="view">
            <div class="auth-box">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required style="width:100%; margin-bottom:1rem;">
                    <input type="password" id="login-password" placeholder="Senha" required style="width:100%; margin-bottom:1rem;">
                    <button type="submit" class="btn-primary" style="width:100%;">Entrar</button>
                </form>
            </div>
        </section>
        
        <section id="search-view" class="view"><h2>Perfis</h2><div id="public-profiles-list"></div></section>
        <section id="matches-view" class="view"><h2>Meus Matches</h2><div id="matches-list"></div></section>
    </main>

    <script>
        // DOMContentLoaded garante que tudo foi carregado antes de rodar qualquer coisa
        document.addEventListener("DOMContentLoaded", () => {
            
            const SUPABASE_URL = 'https://wspghpjjtqvlcvlskbbp.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_vcmvKSxkBg8tP_VBukgE2g_-BsIJnW2';
            const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Exportando funções para o Window para o onclick conseguir enxergar
            window.showView = (viewId) => {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId + '-view').classList.add('active');
            };

            window.logout = async () => {
                await db.auth.signOut();
                location.reload();
            };

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            });

            db.auth.onAuthStateChange((event, session) => {
                if (session) document.body.classList.add('logged-in');
            });
        });
    </script>
</body>
</html>
